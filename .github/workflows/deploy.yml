---
name: deploy

on:
  workflow_dispatch:

# OIDC: the job exchanges a GitHub token for an Azure token. No stored cloud secrets.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_allowed_ssh_cidr: ${{ vars.ALLOWED_SSH_CIDR }}
  TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
  TFSTATE_RG: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_SA: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  SSH_RULE_NAME: allow-ssh-ci-runner

jobs:
  deploy:
    # GitHub-hosted runner: its IP changes every run, so the job opens SSH to that
    # single IP for the duration of the deploy and always removes the rule afterwards.
    runs-on: ubuntu-latest
    environment: azure-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Ansible
        run: python3 -m pip install ansible-core

      - name: Generate inventory from Terraform outputs
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RG" \
            -backend-config="storage_account_name=$TFSTATE_SA" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=incident-tracker.tfstate"
          terraform -chdir=terraform output -json vms | python3 scripts/gen_inventory.py > ansible/inventory/hosts.yml
          echo "WEB_URL=$(terraform -chdir=terraform output -raw app_url)" >> "$GITHUB_ENV"
          echo "APP_RG=$(terraform -chdir=terraform output -raw resource_group)" >> "$GITHUB_ENV"

      - name: Open SSH to this runner's IP only
        run: |
          RUNNER_IP="$(curl -fsS https://api.ipify.org)"
          echo "::add-mask::$RUNNER_IP"
          for nsg in $(az network nsg list --resource-group "$APP_RG" --query "[].name" -o tsv); do
            az network nsg rule create \
              --resource-group "$APP_RG" --nsg-name "$nsg" \
              --name "$SSH_RULE_NAME" --priority 200 \
              --direction Inbound --access Allow --protocol Tcp \
              --destination-port-ranges 22 \
              --source-address-prefixes "$RUNNER_IP/32" -o none
          done
          # Give the rule a moment to take effect
          sleep 30

      - name: Prepare SSH key and database password
        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ansible_key"
          printf 'vault_db_password: "%s"\n' "$DB_PASSWORD" > "$RUNNER_TEMP/db_vars.yml"

      - name: Wait for SSH on every VM
        working-directory: ansible
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/ansible_key
        run: ansible all -m ansible.builtin.wait_for_connection -a "timeout=300"

      - name: Run the playbook
        working-directory: ansible
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/ansible_key
        run: ansible-playbook site.yml -e "@$RUNNER_TEMP/db_vars.yml"

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$WEB_URL/healthz"; then exit 0; fi
            sleep 10
          done
          echo "Smoke test failed" >&2
          exit 1

      - name: Close SSH and clean up key material
        if: always()
        run: |
          if [ -n "${APP_RG:-}" ]; then
            for nsg in $(az network nsg list --resource-group "$APP_RG" --query "[].name" -o tsv); do
              az network nsg rule delete --resource-group "$APP_RG" --nsg-name "$nsg" --name "$SSH_RULE_NAME" -o none || true
            done
          fi
          rm -f "$RUNNER_TEMP/ansible_key" "$RUNNER_TEMP/db_vars.yml"
