---
name: deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_allowed_ssh_cidr: ${{ vars.ALLOWED_SSH_CIDR }}
  TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
  TFSTATE_RG: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_SA: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}

jobs:
  deploy:
    # Self-hosted: the homelab runner's public IP is the one allowed through the
    # VM firewalls (ALLOWED_SSH_CIDR). GitHub-hosted runners have changing IPs.
    runs-on: [self-hosted, linux]
    environment: azure-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install Ansible
        run: python3 -m pip install --user ansible-core

      - name: Generate inventory from Terraform outputs
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RG" \
            -backend-config="storage_account_name=$TFSTATE_SA" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=incident-tracker.tfstate"
          terraform -chdir=terraform output -json vms | python3 scripts/gen_inventory.py > ansible/inventory/hosts.yml
          echo "WEB_URL=$(terraform -chdir=terraform output -raw app_url)" >> "$GITHUB_ENV"

      - name: Prepare SSH key and vault password
        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ansible_key"
          printf '%s' "$VAULT_PASS" > "$RUNNER_TEMP/vault_pass"

      - name: Wait for SSH on every VM
        working-directory: ansible
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/ansible_key
        run: ~/.local/bin/ansible all -m ansible.builtin.wait_for_connection -a "timeout=300"

      - name: Run the playbook
        working-directory: ansible
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/ansible_key
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ runner.temp }}/vault_pass
        run: ~/.local/bin/ansible-playbook site.yml

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$WEB_URL/healthz"; then exit 0; fi
            sleep 10
          done
          echo "Smoke test failed" >&2
          exit 1

      - name: Clean up key material
        if: always()
        run: rm -f "$RUNNER_TEMP/ansible_key" "$RUNNER_TEMP/vault_pass"
