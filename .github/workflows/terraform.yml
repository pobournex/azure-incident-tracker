---
name: terraform

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:

# OIDC: the job exchanges a GitHub token for an Azure token. No stored cloud secrets.
permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_allowed_ssh_cidr: ${{ vars.ALLOWED_SSH_CIDR }}
  TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
  TFSTATE_RG: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_SA: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RG" \
            -backend-config="storage_account_name=$TFSTATE_SA" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=incident-tracker.tfstate"

      - name: Format check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Validate
        run: terraform -chdir=terraform validate

      - name: Plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Show plan in the run summary
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            terraform -chdir=terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 3

  apply:
    # Runs only after a human approves the 'azure-apply' environment.
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: azure-apply
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RG" \
            -backend-config="storage_account_name=$TFSTATE_SA" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=incident-tracker.tfstate"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Apply the approved plan
        run: terraform -chdir=terraform apply -input=false tfplan
