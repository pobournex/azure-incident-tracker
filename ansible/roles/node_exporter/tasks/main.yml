---
- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check installed version
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_installed
  changed_when: false
  failed_when: false

- name: Download and unpack node_exporter
  ansible.builtin.unarchive:
    src: "{{ node_exporter_url }}"
    dest: /tmp
    remote_src: true
  when: node_exporter_version not in (node_exporter_installed.stderr | default('') ~ node_exporter_installed.stdout | default(''))

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: node_exporter_version not in (node_exporter_installed.stderr | default('') ~ node_exporter_installed.stdout | default(''))
  notify: Restart node_exporter

- name: Install systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.service:
    name: node_exporter
    state: started
    enabled: true
