---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Install the reverse proxy site
  ansible.builtin.template:
    src: incident-tracker.conf.j2
    dest: /etc/nginx/sites-available/incident-tracker
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable the site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/incident-tracker
    dest: /etc/nginx/sites-enabled/incident-tracker
    state: link
  notify: Reload nginx

- name: Validate the nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
